services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: educator
      POSTGRES_USER: educator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://educator:${POSTGRES_PASSWORD}@postgres:5432/educator
      SECRET_KEY: ${SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ADMIN_SECRET: ${ADMIN_SECRET}
      LITELLM_URL: http://${LITELLM_CONTAINER}:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
    depends_on:
      - postgres
    networks:
      - internal
      - litellm_network

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    depends_on:
      - backend
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    # TLS termina na borda da Cloudflare; o cloudflared alcanca o nginx
    # pelo loopback, entao nada de porta publica nem certificado local.
    ports:
      - "127.0.0.1:8083:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - internal
      - litellm_network

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
  litellm_network:
    external: true
    name: ${LITELLM_NETWORK}
