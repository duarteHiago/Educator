services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: educator
      POSTGRES_USER: educator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - internal

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://educator:${POSTGRES_PASSWORD}@postgres:5432/educator
      SECRET_KEY: ${SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ADMIN_SECRET: ${ADMIN_SECRET}
      LITELLM_URL: http://${LITELLM_CONTAINER}:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
      REDIS_URL: redis://redis:6379/0
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-educator@educator.yaatoro.com}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    depends_on:
      - postgres
      - redis
    networks:
      - internal
      - litellm_network

  worker:
    build:
      context: ..
      dockerfile: web/worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://educator:${POSTGRES_PASSWORD}@postgres:5432/educator
      REDIS_URL: redis://redis:6379/0
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      LITELLM_URL: http://${LITELLM_CONTAINER}:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-educator@educator.yaatoro.com}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    depends_on:
      - redis
      - postgres
    command: celery -A app.celery_app worker --concurrency=3 --loglevel=info
    networks:
      - internal
      - litellm_network

  beat:
    build:
      context: ..
      dockerfile: web/worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://educator:${POSTGRES_PASSWORD}@postgres:5432/educator
      REDIS_URL: redis://redis:6379/0
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      LITELLM_URL: http://${LITELLM_CONTAINER}:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-educator@educator.yaatoro.com}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    depends_on:
      - redis
      - postgres
    command: celery -A app.celery_app beat --loglevel=info
    volumes:
      - celerybeat_schedule:/app/beat
    networks:
      - internal

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    depends_on:
      - backend
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - internal

volumes:
  postgres_data:
  celerybeat_schedule:

networks:
  internal:
    driver: bridge
  litellm_network:
    external: true
    name: ${LITELLM_NETWORK}
