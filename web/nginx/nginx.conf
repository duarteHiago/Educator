events { worker_connections 1024; }

http {
    server_tokens off;

    # Resolver interno do Docker — resolve nomes de containers dinamicamente
    # Sem isso, nginx falha no startup se um upstream ainda não existe
    resolver 127.0.0.11 valid=10s ipv6=off;

    limit_req_zone $binary_remote_addr zone=global:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=llm:10m rate=60r/m;

    server {
        listen 80;
        server_name educator.yaatoro.com _;

        client_max_body_size 4m;

        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

        location /api/auth/login {
            limit_req zone=login burst=3 nodelay;
            set $backend http://backend:8000;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/ {
            limit_req zone=global burst=20 nodelay;
            set $backend http://backend:8000;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Proxy LLM - endpoint OpenAI-compatible consumido pelo educator.exe
        # PROXY_URL=https://educator.yaatoro.com/llm/v1
        location /llm/ {
            limit_req zone=llm burst=10 nodelay;
            set $litellm http://educator-proxy-litellm-1:4000;
            rewrite ^/llm/(.*)$ /$1 break;
            proxy_pass $litellm;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        location / {
            limit_req zone=global burst=30 nodelay;
            set $frontend http://frontend:3000;
            proxy_pass $frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
