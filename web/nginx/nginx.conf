events { worker_connections 1024; }

http {
    # Oculta versão do nginx (reduz surface de ataque)
    server_tokens off;

    # Rate limit global: 30 req/s por IP
    limit_req_zone $binary_remote_addr zone=global:10m rate=30r/s;
    # Rate limit específico para login: 5 req/min por IP
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # Redireciona HTTP → HTTPS
    server {
        listen 80;
        server_name educator.yaatoro.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name educator.yaatoro.com;

        ssl_certificate     /etc/letsencrypt/live/educator.yaatoro.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/educator.yaatoro.com/privkey.pem;

        # TLS moderno: desativa TLS 1.0/1.1
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # HSTS: força HTTPS por 1 ano
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Impede clickjacking
        add_header X-Frame-Options DENY always;
        # Impede MIME sniffing
        add_header X-Content-Type-Options nosniff always;
        # CSP básico
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src fonts.gstatic.com;" always;

        # Limite de tamanho do body (evita DoS)
        client_max_body_size 1m;

        # Rate limit de login (mais restrito)
        location /api/auth/login {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API geral
        location /api/ {
            limit_req zone=global burst=20 nodelay;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend Next.js
        location / {
            limit_req zone=global burst=30 nodelay;
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
