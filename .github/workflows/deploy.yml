name: Deploy → VPS

on:
  push:
    branches: [main]
    paths:
      - "web/**"

jobs:
  deploy:
    name: Deploy educator.yaatoro.com
    runs-on: ubuntu-latest

    steps:
      - name: SSH → git pull + docker compose up
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail

            cd DEPLOY_DIR
            git fetch origin main
            git reset --hard origin/main

            cd web
            docker compose up -d --build

            echo ""
            echo "=== Containers ==="
            docker compose ps

      - name: Health check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sleep 10
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || echo "000")
            echo "Backend /health → HTTP $STATUS"
            if [ "$STATUS" != "200" ]; then
              echo "ERRO: backend não respondeu com 200"
              docker compose -f DEPLOY_DIR/web/docker-compose.yml logs --tail=50 backend
              exit 1
            fi
            echo "Deploy OK"
