name: Deploy → VPS

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy educator.yaatoro.com
    runs-on: ubuntu-latest

    steps:
      - name: SSH → git pull + docker compose up
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin main
            git reset --hard origin/main
            cd web
            docker compose up -d --build
            echo "=== Containers ==="
            docker compose ps

      - name: Health check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sleep 10
            cd "${{ secrets.DEPLOY_PATH }}/web"
            STATUS=$(docker compose exec -T backend python3 -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status)" 2>/dev/null || echo "000")
            echo "Backend /health → HTTP $STATUS"
            if [ "$STATUS" != "200" ]; then
              echo "ERRO: backend nao respondeu com 200"
              docker compose logs --tail=50 backend
              exit 1
            fi
            echo "Deploy OK"
