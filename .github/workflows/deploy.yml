name: Deploy → VPS

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy educator.yaatoro.com
    runs-on: ubuntu-latest

    steps:
      - name: SSH → git pull + docker compose up
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail

            cd /opt/educator-web
            git fetch origin main
            git reset --hard origin/main

            cd web
            docker compose up -d --build

            echo ""
            echo "=== Containers ==="
            docker compose ps

      - name: Health check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sleep 10
            cd /opt/educator-web/web
            STATUS=$(docker compose exec -T backend python3 -c "
import urllib.request
try:
    with urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5) as r:
        print(r.status)
except Exception as e:
    print(0)
")
            echo "Backend /health → HTTP $STATUS"
            if [ "$STATUS" != "200" ]; then
              echo "ERRO: backend não respondeu com 200"
              docker compose logs --tail=50 backend
              exit 1
            fi
            echo "Deploy OK"
