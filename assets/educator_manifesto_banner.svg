  <text x="40" y="282" font-family="Georgia, serif" font-size="16" style="fill:rgb(160, 152, 136);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Georgia, serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
