  </text>
  <text x="40" y="202" font-family="Georgia, serif" font-size="15.5" font-style="italic" style="fill:rgb(240, 235, 224);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Georgia, serif;font-size:15.5px;font-weight:400;font-style:italic;text-anchor:start;dominant-baseline:auto">
    não para ensinar, mas para gerar métricas."
  </text>

